<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniBot Control</title>

<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #14171c;
    --panel-2: #1a1e24;
    --line: #262b33;
    --text: #e6e9ee;
    --dim: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --amber: #d29922;
    --blue: #388bfd;
    --orange: #db6d28;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px 20px 48px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 16px;
  }
  .title { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
  .title span { color: var(--dim); font-weight: 400; margin-left: 8px; }

  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 13px;
    font-size: 12px; font-weight: 500; color: var(--dim);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .dot.ok   { background: var(--green); box-shadow: 0 0 8px rgba(63,185,80,.6); }
  .dot.warn { background: var(--amber); }
  .dot.err  { background: var(--red); }

  .stage {
    position: relative; background: #000;
    border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; line-height: 0;
  }
  #cam {
    width: 100%; max-height: 74vh; object-fit: contain;
    display: block; cursor: crosshair; background: #000;
  }
  #overlay {
    position: absolute; left: 0; top: 0;
    pointer-events: none;
  }
  button.cal.armed { outline: 2px solid #3fbd94; outline-offset: 1px; }
  button.cal.done::after { content: " ●"; color: #3fbd94; }
  .hint { font-size: 12px; color: var(--dim); margin: 0 0 4px; line-height: 1.5; }
  .views { display: flex; align-items: flex-start; }
  .view { position: relative; flex: 1 1 0; min-width: 0; line-height: 0; }
  .mapview { border-left: 1px solid var(--line); background: #0b0d10; }
  #map { display: block; width: 100%; height: auto; pointer-events: none; }
  @media (max-width: 860px) { .views { flex-direction: column; } .mapview { border-left: 0; border-top: 1px solid var(--line); } }

  .hud {
    position: absolute; left: 12px; bottom: 12px; right: 12px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 13px; border-radius: 9px;
    background: rgba(8,10,13,.82);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(8px);
    font: 12px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: var(--dim);
  }
  .hud b { color: var(--text); font-weight: 600; }
  .hud .sep { color: #333a44; }

  .timer {
    position: absolute; top: 12px; right: 12px;
    padding: 7px 14px; border-radius: 9px;
    background: rgba(8,10,13,.82);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(8px);
    font: 600 18px/1 ui-monospace, Consolas, monospace;
    letter-spacing: .5px;
  }
  .timer.run { color: var(--green); }
  .timer.end { color: var(--red); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 14px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 11px; padding: 14px;
  }
  .card h2 {
    margin: 0 0 11px; font-size: 11px; font-weight: 600;
    letter-spacing: .9px; text-transform: uppercase; color: var(--dim);
  }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 11px 14px; font-size: 13.5px; font-weight: 500;
    font-family: inherit; cursor: pointer; text-align: left;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    transition: background .12s, border-color .12s;
  }
  button:hover { background: #222831; border-color: #39414d; }
  button:active { transform: translateY(1px); }
  button kbd {
    font: 11px ui-monospace, Consolas, monospace; color: var(--dim);
    background: #0e1116; border: 1px solid var(--line);
    border-radius: 4px; padding: 2px 6px;
  }
  button.primary { background: rgba(63,185,80,.13); border-color: rgba(63,185,80,.45); color: #7ee28a; }
  button.primary:hover { background: rgba(63,185,80,.2); }
  button.danger  { background: rgba(248,81,73,.13); border-color: rgba(248,81,73,.45); color: #ff8b84; }
  button.danger:hover { background: rgba(248,81,73,.2); }
  button.blue   { border-left: 3px solid var(--blue); }
  button.orange { border-left: 3px solid var(--orange); }
  button.sel {
    background: rgba(56,139,253,.18);
    border-color: var(--blue);
    box-shadow: inset 0 0 0 1px rgba(56,139,253,.35);
  }

  .log {
    margin-top: 14px; padding: 11px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    font: 12.5px ui-monospace, Consolas, monospace; color: var(--dim);
    min-height: 38px; display: flex; align-items: center;
  }
  .hint { margin: 12px 2px 0; font-size: 12.5px; color: #6e7681; }
</style>

<div class="wrap">
  <header>
    <div class="title">MiniBot Control <span>Sector Siege</span></div>
    <div class="pills">
      <div class="pill"><i class="dot" id="d-link"></i><span id="t-link">link</span></div>
      <div class="pill"><i class="dot" id="d-tag"></i><span id="t-tag">tag</span></div>
      <div class="pill"><i class="dot" id="d-cal"></i><span id="t-cal">calibration</span></div>
      <div class="pill"><i class="dot" id="d-en"></i><span id="t-en">disabled</span></div>
    </div>
  </header>

  <div class="stage">
    <div class="views">
      <div class="view"><img id="cam" src="/stream" alt="field view"><canvas id="overlay"></canvas></div>
      <div class="view mapview"><canvas id="map"></canvas></div>
    </div>
    <div class="timer" id="timer">90.0</div>
    <div class="hud">
      <span>X <b id="px">—</b></span><span class="sep">|</span>
      <span>Y <b id="py">—</b></span><span class="sep">|</span>
      <span>HDG <b id="ph">—</b></span><span class="sep">|</span>
      <span>GOAL <b id="pgoal">none</b></span><span class="sep">|</span>
      <span id="pstate">waiting</span>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>1 · Calibrate</h2>
      <div class="stack">
        <p class="hint">Pick a corner, then click it in the camera view.</p>
        <div class="pair">
          <button class="blue cal" data-c="0" onclick="armCalib(0)">Blue A</button>
          <button class="blue cal" data-c="1" onclick="armCalib(1)">Blue B</button>
        </div>
        <div class="pair">
          <button class="orange cal" data-c="3" onclick="armCalib(3)">Orange A</button>
          <button class="orange cal" data-c="2" onclick="armCalib(2)">Orange B</button>
        </div>
        <button onclick="post('/api/calib/reset')">Clear all<kbd id="caln">0/4</kbd></button>
      </div>
    </div>

    <div class="card">
      <h2>2 · Match</h2>
      <div class="stack">
        <button class="primary" onclick="enable()">Enable<kbd>space</kbd></button>
        <button class="danger" onclick="disable()">Disable<kbd>D</kbd></button>
        <button id="drawbtn" onclick="toggleDraw()">Draw path<kbd>P</kbd></button>
        <button class="primary" onclick="runPath()">Run path<kbd>R</kbd></button>
        <button onclick="cancelGoal()">Cancel<kbd>C</kbd></button>
        <button onclick="clearPath()">Clear path</button>
      </div>
    </div>

    <div class="card">
      <h2>Platforms</h2>
      <div class="stack">
        <div class="pair">
          <button class="blue" data-t="1" onclick="target(1)">Corner A<kbd>1</kbd></button>
          <button class="blue" data-t="2" onclick="target(2)">Corner B<kbd>2</kbd></button>
        </div>
        <button class="blue" data-t="5" onclick="target(5)">Centre blue<kbd>5</kbd></button>
        <button class="orange" data-t="6" onclick="target(6)">Centre orange<kbd>6</kbd></button>
        <div class="pair">
          <button class="orange" data-t="3" onclick="target(3)">Corner A<kbd>3</kbd></button>
          <button class="orange" data-t="4" onclick="target(4)">Corner B<kbd>4</kbd></button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>3 · Platforms</h2>
      <div class="stack">
        <div class="pair">
          <button class="blue" data-t="1" onclick="target(1)">Blue A<kbd>1</kbd></button>
          <button class="blue" data-t="2" onclick="target(2)">Blue B<kbd>2</kbd></button>
        </div>
        <div class="pair">
          <button class="orange" data-t="3" onclick="target(3)">Orange A<kbd>3</kbd></button>
          <button class="orange" data-t="4" onclick="target(4)">Orange B<kbd>4</kbd></button>
        </div>
        <button class="blue" data-t="5" onclick="target(5)">Centre blue<kbd>5</kbd></button>
        <button class="orange" data-t="6" onclick="target(6)">Centre orange<kbd>6</kbd></button>
        <button onclick="post('/api/zero')">Zero heading</button>
      </div>
    </div>
  </div>

  <div class="log" id="log">ready</div>
</div>

<script>
let enabled = false;
let selected = null;
let startedAt = null;

function say(msg) { document.getElementById('log').textContent = msg; }

async function post(url, body) {
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body || {})
    });
    const j = await r.json();
    if (j.message) document.getElementById('log').textContent = j.message;
  } catch (e) {
    document.getElementById('log').textContent = 'server not responding';
  }
}

function target(id) {
  selected = id;
  markSelected();
  post('/api/target', {id: id});
}

function markSelected() {
  document.querySelectorAll('button[data-t]').forEach(b => {
    b.classList.toggle('sel', parseInt(b.dataset.t, 10) === selected);
  });
}
function enable()  { enabled = true;  startedAt = Date.now(); post('/api/enable'); }
function disable() {
  enabled = false; startedAt = null; selected = null;
  markSelected();
  post('/api/disable');
}
function cancelGoal() { selected = null; markSelected(); post('/api/cancel'); }

let drawMode = false;
let anchored = false;
let placed = [];
let cursor = null;
let tagPix = null;
let frameSize = null;

const SNAP_PX = 26;

function camPoint(e) {
  const img = document.getElementById('cam');
  const r = img.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (img.naturalWidth  / r.width),
    y: (e.clientY - r.top)  * (img.naturalHeight / r.height)
  };
}

function toScreen(p) {
  const img = document.getElementById('cam');
  if (!img.naturalWidth) return {x: 0, y: 0};
  return {
    x: p.x * (img.clientWidth  / img.naturalWidth),
    y: p.y * (img.clientHeight / img.naturalHeight)
  };
}

function sizeOverlay() {
  const img = document.getElementById('cam');
  const c = document.getElementById('overlay');
  if (c.width !== img.clientWidth || c.height !== img.clientHeight) {
    c.width = img.clientWidth;
    c.height = img.clientHeight;
  }
}

function drawOverlay() {
  sizeOverlay();
  const c = document.getElementById('overlay');
  const g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);

  calib.forEach((c, i) => {
    if (!c.image) return;
    const p = toScreen({x: c.image[0], y: c.image[1]});
    g.beginPath();
    g.arc(p.x, p.y, 7, 0, Math.PI * 2);
    g.fillStyle = '#3fbd94';
    g.fill();
    g.strokeStyle = '#0b1016';
    g.lineWidth = 2;
    g.stroke();
    g.beginPath();
    g.moveTo(p.x - 13, p.y); g.lineTo(p.x - 9, p.y);
    g.moveTo(p.x + 9, p.y);  g.lineTo(p.x + 13, p.y);
    g.moveTo(p.x, p.y - 13); g.lineTo(p.x, p.y - 9);
    g.moveTo(p.x, p.y + 9);  g.lineTo(p.x, p.y + 13);
    g.strokeStyle = '#3fbd94';
    g.lineWidth = 1.5;
    g.stroke();
    g.fillStyle = '#3fbd94';
    g.font = '11px system-ui, sans-serif';
    g.fillText(c.name, p.x + 12, p.y - 10);
  });

  if (armedCalib !== null) {
    g.strokeStyle = '#3fbd94';
    g.lineWidth = 2;
    g.setLineDash([6, 4]);
    g.strokeRect(1, 1, c.width - 2, c.height - 2);
    g.setLineDash([]);
  }

  if (drawMode && tagPix && !anchored) {
    const t = toScreen(tagPix);
    g.beginPath();
    g.arc(t.x, t.y, 9, 0, Math.PI * 2);
    g.strokeStyle = '#ffaa3c';
    g.lineWidth = 2;
    g.stroke();
    g.beginPath();
    g.arc(t.x, t.y, 3.5, 0, Math.PI * 2);
    g.fillStyle = '#ffaa3c';
    g.fill();
  }

  if (!placed.length) return;

  const pts = placed.map(toScreen);
  g.strokeStyle = '#ffaa3c';
  g.lineWidth = 2.5;
  g.beginPath();
  g.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
  g.stroke();

  if (anchored && cursor) {
    const cp = toScreen(cursor);
    const lastp = pts[pts.length - 1];
    g.setLineDash([7, 5]);
    g.strokeStyle = '#8f87ff';
    g.beginPath();
    g.moveTo(lastp.x, lastp.y);
    g.lineTo(cp.x, cp.y);
    g.stroke();
    g.setLineDash([]);
    const dx = cursor.x - placed[placed.length - 1].x;
    const dy = cursor.y - placed[placed.length - 1].y;
    const px = Math.hypot(dx, dy).toFixed(0);
    g.fillStyle = '#8f87ff';
    g.font = '12px system-ui, sans-serif';
    g.fillText(px + ' px', cp.x + 10, cp.y - 10);
  }

  pts.forEach((p, i) => {
    g.beginPath();
    g.arc(p.x, p.y, i === 0 ? 5 : 6, 0, Math.PI * 2);
    g.fillStyle = i === 0 ? '#5dcaa5' : '#ffaa3c';
    g.fill();
    g.strokeStyle = '#11141a';
    g.lineWidth = 1.5;
    g.stroke();
  });
}

let armedCalib = null;
let calib = [];

function armCalib(i) {
  armedCalib = (armedCalib === i) ? null : i;
  if (armedCalib !== null) setDrawMode(false);
  markCalib();
  say(armedCalib === null ? 'calibration point released'
      : 'now click that corner platform in the camera view');
}

function markCalib() {
  document.querySelectorAll('button.cal').forEach(b => {
    const i = parseInt(b.dataset.c, 10);
    b.classList.toggle('armed', armedCalib === i);
    const got = calib[i] && calib[i].image;
    b.classList.toggle('done', !!got);
  });
}

document.getElementById('cam').addEventListener('click', (e) => {
  const p = camPoint(e);
  if (armedCalib !== null) {
    const i = armedCalib;
    armedCalib = null;
    markCalib();
    post('/api/calib/set', {index: i, x: p.x, y: p.y});
    return;
  }
  if (!drawMode) {
    selected = null;
    markSelected();
    post('/api/click', p);
    return;
  }
  if (!anchored) {
    if (!tagPix) { say('no tag visible to start from'); return; }
    const t = toScreen(tagPix);
    const s = toScreen(p);
    if (Math.hypot(s.x - t.x, s.y - t.y) > SNAP_PX) {
      say('click the dot on the tag to start the line');
      return;
    }
    placed = [{x: tagPix.x, y: tagPix.y}];
    anchored = true;
    cursor = {x: tagPix.x, y: tagPix.y};
    drawOverlay();
    return;
  }
  placed.push(p);
  drawOverlay();
  sendPath();
});

document.getElementById('cam').addEventListener('mousemove', (e) => {
  if (!drawMode || !anchored) return;
  cursor = camPoint(e);
  drawOverlay();
});

async function sendPath() {
  if (placed.length < 2) return;
  await post('/api/path', {points: placed.slice(1)});
}

function setDrawMode(on) {
  drawMode = on;
  if (!on) { anchored = false; cursor = null; }
  const img = document.getElementById('cam');
  img.style.outline = on ? '2px solid #ffaa3c' : 'none';
  const b = document.getElementById('drawbtn');
  b.textContent = on ? 'Placing line…' : 'Draw path';
  b.classList.toggle('primary', on);
  drawOverlay();
}

function toggleDraw() {
  if (!drawMode) { placed = []; anchored = false; }
  setDrawMode(!drawMode);
}

function runPath() {
  selected = null;
  markSelected();
  post('/api/path/run');
}

function clearPath() {
  placed = [];
  anchored = false;
  cursor = null;
  setDrawMode(false);
  post('/api/path/clear');
}

function undoPoint() {
  if (placed.length > 1) {
    placed.pop();
    drawOverlay();
    if (placed.length > 1) sendPath(); else post('/api/path/clear');
  }
}

window.addEventListener('resize', drawOverlay);

const FX = 1829, FY = 1219, D2R = Math.PI / 180;
const MAP_CENTERS = [
  {x: 610, y: 610, ramps: [0, 120, 240]},
  {x: 1219, y: 610, ramps: [180, 60, 300]}
];
const MAP_CORNERS = [
  {x: 305, y: 305, rot: 0}, {x: 305, y: 914, rot: 0},
  {x: 1524, y: 305, rot: 60}, {x: 1524, y: 914, rot: 60}
];
const MAP_TILES = [
  [610, 940], [665, 985], [610, 280], [665, 235],
  [1219, 940], [1164, 985], [1219, 280], [1164, 235], [914, 610]
];
const HEX_IN = 102, RAMP_RUN = 102, CORNER_R = 203, BOT_MM = 152;

let mapScale = 1, livePose = null, livePath = [];

function mapHex(cx, cy, r, rot) {
  const p = [];
  for (let i = 0; i < 6; i++) {
    const a = (rot + 30 + i * 60) * D2R;
    p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return p;
}
function mapTri(cx, cy, R, rot) {
  const v = [0, 120, 240].map(a => {
    const t = (a + rot) * D2R;
    return [cx + R * Math.cos(t), cy + R * Math.sin(t)];
  });
  const k = 0.26, out = [];
  for (let i = 0; i < 3; i++) {
    const a = v[i], b = v[(i + 1) % 3];
    out.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]);
    out.push([a[0] + (b[0] - a[0]) * (1 - k), a[1] + (b[1] - a[1]) * (1 - k)]);
  }
  return out;
}
function mapRamp(c, nd) {
  const n = nd * D2R, t = n + Math.PI / 2;
  const half = (HEX_IN / Math.cos(30 * D2R)) * Math.sin(30 * D2R);
  const bx = c.x + HEX_IN * Math.cos(n), by = c.y + HEX_IN * Math.sin(n);
  const ox = bx + RAMP_RUN * Math.cos(n), oy = by + RAMP_RUN * Math.sin(n);
  const sh = half * 0.78;
  return [
    [bx + half * Math.cos(t), by + half * Math.sin(t)],
    [ox + sh * Math.cos(t), oy + sh * Math.sin(t)],
    [ox - sh * Math.cos(t), oy - sh * Math.sin(t)],
    [bx - half * Math.cos(t), by - half * Math.sin(t)]
  ];
}

function fitMap() {
  const cm = document.getElementById('map');
  const w = cm.parentElement.clientWidth;
  if (!w) return;
  const dpr = window.devicePixelRatio || 1;
  cm.width = Math.round(w * dpr);
  cm.height = Math.round(w * (FY / FX) * dpr);
  cm.style.height = Math.round(w * (FY / FX)) + 'px';
  mapScale = (w * dpr) / FX;
  drawMap();
}

function drawMap() {
  const cm = document.getElementById('map');
  const g = cm.getContext('2d');
  const M = v => v * mapScale;
  const poly = pts => {
    g.beginPath();
    g.moveTo(M(pts[0][0]), M(pts[0][1]));
    for (let i = 1; i < pts.length; i++) g.lineTo(M(pts[i][0]), M(pts[i][1]));
    g.closePath();
  };

  g.clearRect(0, 0, cm.width, cm.height);
  g.fillStyle = '#12151a';
  g.fillRect(0, 0, cm.width, cm.height);

  g.strokeStyle = 'rgba(255,255,255,.14)';
  g.lineWidth = Math.max(1, M(3));
  g.setLineDash([M(22), M(16)]);
  [610, 1219].forEach(x => { g.beginPath(); g.moveTo(M(x), 0); g.lineTo(M(x), M(FY)); g.stroke(); });
  g.setLineDash([]);

  MAP_CENTERS.forEach(c => c.ramps.forEach(n => {
    poly(mapRamp(c, n));
    g.fillStyle = 'rgba(255,170,60,.5)'; g.fill();
  }));
  MAP_CENTERS.forEach(c => {
    poly(mapHex(c.x, c.y, HEX_IN / Math.cos(30 * D2R), 0));
    g.fillStyle = '#39404b'; g.fill();
  });
  MAP_CORNERS.forEach(c => {
    const p = mapTri(c.x, c.y, CORNER_R, c.rot);
    poly(p); g.fillStyle = '#39404b'; g.fill();
    for (let i = 0; i < 6; i += 2) {
      const a = p[i], b = p[(i + 1) % 6];
      g.beginPath(); g.moveTo(M(a[0]), M(a[1])); g.lineTo(M(b[0]), M(b[1]));
      g.strokeStyle = 'rgba(255,170,60,.6)'; g.lineWidth = Math.max(2, M(10)); g.stroke();
    }
  });
  MAP_TILES.forEach(([x, y]) => {
    poly(mapHex(x, y, 58, 0));
    g.fillStyle = 'rgba(60,190,150,.55)'; g.fill();
  });

  if (livePath.length > 1) {
    g.beginPath();
    g.moveTo(M(livePath[0][0]), M(livePath[0][1]));
    for (let i = 1; i < livePath.length; i++) g.lineTo(M(livePath[i][0]), M(livePath[i][1]));
    g.strokeStyle = '#ffaa3c'; g.lineWidth = Math.max(2, M(8));
    g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke();
    livePath.forEach(p => {
      g.beginPath(); g.arc(M(p[0]), M(p[1]), Math.max(3, M(20)), 0, 7);
      g.fillStyle = '#ffaa3c'; g.fill();
    });
  }

  if (livePose) {
    const [x, y, h] = livePose;
    g.save();
    g.translate(M(x), M(y));
    g.rotate(h * D2R);
    const hh = M(BOT_MM / 2);
    g.fillStyle = 'rgba(80,160,235,.3)';
    g.strokeStyle = '#4d9ae8'; g.lineWidth = Math.max(1, M(7));
    g.beginPath(); g.rect(-hh, -hh, hh * 2, hh * 2); g.fill(); g.stroke();
    g.beginPath();
    g.moveTo(hh * 0.95, 0); g.lineTo(hh * 0.3, -hh * 0.45); g.lineTo(hh * 0.3, hh * 0.45);
    g.closePath(); g.fillStyle = '#4d9ae8'; g.fill();
    g.restore();
  } else {
    g.fillStyle = 'rgba(255,255,255,.35)';
    g.font = `${Math.max(11, M(60))}px system-ui, sans-serif`;
    g.textAlign = 'center';
    g.fillText('no tag', M(FX / 2), M(FY / 2));
    g.textAlign = 'start';
  }
}

window.addEventListener('resize', fitMap);
setTimeout(fitMap, 50);

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space') { e.preventDefault(); enable(); }
  else if (k === 'd') disable();
  else if (k === 'c') cancelGoal();
  else if (k === 'p') toggleDraw();
  else if (k === 'r') runPath();
  else if (k === 'z') undoPoint();
  else if (e.key === 'Escape') setDrawMode(false);
  else if (k >= '1' && k <= '6') target(parseInt(k, 10));
});

function setDot(id, cls, label, text) {
  document.getElementById(id).className = 'dot ' + cls;
  document.getElementById(label).textContent = text;
}

function tick() {
  const el = document.getElementById('timer');
  if (!startedAt) { el.textContent = '90.0'; el.className = 'timer'; return; }
  const left = Math.max(0, 90 - (Date.now() - startedAt) / 1000);
  el.textContent = left.toFixed(1);
  el.className = 'timer ' + (left <= 15 ? 'end' : 'run');
  if (left === 0 && enabled) { enabled = false; startedAt = null; }
}
setInterval(tick, 100);

setInterval(async () => {
  let s;
  try {
    s = await (await fetch('/api/state')).json();
  } catch (e) {
    setDot('d-link', 'err', 't-link', 'server down');
    return;
  }

  setDot('d-link', 'ok', 't-link', 'server up');

  tagPix = s.tag ? {x: s.tag[0], y: s.tag[1]} : null;
  frameSize = s.frame_size || null;
  livePose = s.pose || null;
  livePath = s.path || [];
  calib = s.calib || [];
  markCalib();
  drawOverlay();
  drawMap();

  if (s.pose) {
    setDot('d-tag', 'ok', 't-tag', 'tag locked');
    document.getElementById('px').textContent = s.pose[0].toFixed(0);
    document.getElementById('py').textContent = s.pose[1].toFixed(0);
    document.getElementById('ph').textContent = s.pose[2].toFixed(1) + '°';
  } else {
    setDot('d-tag', 'err', 't-tag', 'no tag');
    document.getElementById('px').textContent = '—';
    document.getElementById('py').textContent = '—';
    document.getElementById('ph').textContent = '—';
  }

  if (s.calibrated) setDot('d-cal', 'ok', 't-cal', 'calibrated');
  else setDot('d-cal', 'warn', 't-cal', 'calibrate ' + s.calib_points + '/4');
  document.getElementById('caln').textContent = s.calib_points + '/4';

  enabled = s.enabled;
  if (!s.enabled) startedAt = null;
  setDot('d-en', s.enabled ? 'ok' : 'err', 't-en', s.enabled ? 'ENABLED' : 'disabled');
  document.getElementById('pgoal').textContent =
    s.goal ? (s.goal_label || `${s.goal[0].toFixed(0)},${s.goal[1].toFixed(0)}`) : 'none';
  document.getElementById('pstate').textContent = s.status;
}, 300);
</script>
